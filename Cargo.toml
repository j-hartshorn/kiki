[package]
name = "kiki"
version = "0.1.0"
edition = "2024"

[dependencies]
async-openai = { version = "=0.41.3", default-features = false, features = ["byot", "middleware", "responses", "rustls"] }
cap-std = "4"
futures = "0.3"
ratatui = "0.30.2"
monty-pool = "=0.0.21"
monty-types = "=0.0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
tower = { version = "0.5", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
