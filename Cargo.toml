[package]
name = "kiki"
version = "0.1.0"
edition = "2024"

[dependencies]
cap-std = "4"
ratatui = "0.30.2"
monty-pool = "=0.0.21"
monty-types = "=0.0.21"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
