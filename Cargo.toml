[package]
name = "kiki"
version = "0.1.0"
edition = "2024"

[dependencies]
async-openai = { version = "=0.41.3", default-features = false, features = ["byot", "middleware", "responses", "rustls"] }
arboard = { version = "=3.6.1", default-features = false }
blake3 = "1"
cap-std = "4"
futures = "0.3"
getrandom = "0.3"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
rustix = { version = "1", features = ["fs"] }
monty-pool = "=0.0.22"
monty-types = "=0.0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "=0.3.55", default-features = false, features = ["formatting"] }
thiserror = "2"
tempfile = "=3.27.0"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml_edit = "=0.25.13"
tokio-util = "0.7"
tower = { version = "0.5", default-features = false }
tree-sitter-highlight = "=0.26.13"
tree-sitter-python = "=0.25.0"
tui-markdown = { version = "=0.3.9", default-features = false }
unicode-segmentation = "=1.13.3"
ignore = "0.4"
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
[target.'cfg(unix)'.dependencies]
libc = "0.2"
